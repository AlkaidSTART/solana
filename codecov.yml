# Codecov 配置：常用 recipes 落地（https://docs.codecov.com/docs/common-recipe-list）
# 修改后请用官方接口校验：curl -X POST --data-binary @codecov.yml https://codecov.io/validate
# CI（.github/workflows/ci.yml）内置了同一校验步骤。

codecov:
  # 不等其它 CI 检查全部结束，测试失败时也能尽快给出 Codecov 状态。
  require_ci_to_pass: false
  notify:
    # 通知不必等 CI 全部完成再发送。
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        # 与 base commit 对比，不要求固定百分比；当前基线约 20%，先积累数据。
        target: auto
        # 允许相对 base 最多 1% 的波动，降低偶发抖动的误报。
        threshold: 1%
        base: auto
        # 非阻塞：先展示检查结果不拦截合并；基线稳定后改为 false 即可开始拦截。
        informational: true
    patch:
      default:
        # diff 覆盖率同样先以 informational 提示，不强制 100%。
        target: auto
        threshold: 1%
        informational: true

comment:
  # 评论同时展示项目覆盖率变化与 diff 覆盖率。
  layout: "diff, flags, files"
  behavior: default
  # 覆盖率无变化也评论，便于对照。
  require_changes: false
  require_base: false
  require_head: true
  # 不只显示 git diff 覆盖率，同时显示项目覆盖率。
  hide_project_coverage: false
